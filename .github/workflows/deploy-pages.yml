name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        # postinstall 会自动把 npm 包内的 wasm 复制到 public/wasm（离线推理引擎）

      - name: Download pose model
        run: |
          mkdir -p public/models src/assets
          curl -sL -o public/models/pose_landmarker_full.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task"
          ls -la public/models/
          # 生成 base64 副本（网页/内联均可免网络解码加载）
          base64 -w 0 public/models/pose_landmarker_full.task > public/models/pose_landmarker_full.task.b64
          # 同时放入 src/assets 供构建时内联进 JS（安卓/网页零文件读取加载）
          cp public/models/pose_landmarker_full.task.b64 src/assets/model-b64.txt

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
