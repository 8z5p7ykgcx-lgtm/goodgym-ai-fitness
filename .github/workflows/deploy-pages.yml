name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        # postinstall 会自动：
        #   1. 把 npm 包内的 wasm 复制到 public/wasm（离线推理引擎）
        #   2. 下载姿态模型到 public/models/（带 3 次重试）
        #   3. 生成 base64 副本并同步到 src/assets/model-b64.txt（构建时内联进 JS）

      - name: Verify model files
        run: |
          echo "=== 模型与引擎文件检查 ==="
          ls -lh public/models/ 2>/dev/null || echo "::warning::public/models/ 不存在"
          ls -lh public/wasm/ 2>/dev/null || echo "::warning::public/wasm/ 不存在"
          ls -lh src/assets/ 2>/dev/null || echo "::warning::src/assets/ 不存在"

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用仓库的 GitHub Pages 并配置为「GitHub Actions」构建源
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
